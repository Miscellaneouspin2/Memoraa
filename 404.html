<script id="memoraa-step10-accessibility-script">
(()=>{const L=()=>document.documentElement.lang==='hi'?'hi':'en';const msg=document.getElementById('globalA11yStatus');const announce=(en,hi,urgent=false)=>{if(!msg)return;msg.setAttribute('aria-live',urgent?'assertive':'polite');msg.textContent='';requestAnimationFrame(()=>msg.textContent=L()==='hi'?hi:en)};window.memoraaAnnounce=announce;
const pref={large:'memoraaLargeText',contrast:'memoraaHighContrast'};function applyPrefs(){document.body.classList.toggle('large-text',localStorage.getItem(pref.large)==='1');document.body.classList.toggle('high-contrast',localStorage.getItem(pref.contrast)==='1');document.querySelectorAll('[data-a11y=large]').forEach(b=>b.setAttribute('aria-pressed',String(document.body.classList.contains('large-text'))));document.querySelectorAll('[data-a11y=contrast]').forEach(b=>b.setAttribute('aria-pressed',String(document.body.classList.contains('high-contrast'))))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a11y]');if(!b)return;const k=b.dataset.a11y;if(k==='large')localStorage.setItem(pref.large,document.body.classList.contains('large-text')?'0':'1');if(k==='contrast')localStorage.setItem(pref.contrast,document.body.classList.contains('high-contrast')?'0':'1');applyPrefs();announce('Accessibility preference updated.','सुगम्यता विकल्प अपडेट हुआ।')});
function labelControls(){document.querySelectorAll('input,select,textarea').forEach((el,i)=>{if(!el.id)el.id='field-'+i;if(!el.hasAttribute('aria-label')&&!el.hasAttribute('aria-labelledby')){const lab=el.closest('label');if(lab){let s=lab.querySelector('span');if(s&&!s.id)s.id=el.id+'-label';if(s)el.setAttribute('aria-labelledby',s.id)}else el.setAttribute('aria-label',el.name||el.placeholder||el.type||'Input')}});document.querySelectorAll('button').forEach((b,i)=>{if(!b.textContent.trim()&&!b.getAttribute('aria-label'))b.setAttribute('aria-label','Action '+(i+1))})}
function tables(){document.querySelectorAll('.matrix').forEach((w,i)=>{w.tabIndex=0;w.setAttribute('role','region');w.setAttribute('aria-label',L()==='hi'?'स्क्रॉल करने योग्य तालिका':'Scrollable table');const t=w.querySelector('table');if(t&&!t.querySelector('caption')){const c=document.createElement('caption');c.className='sr-only';c.textContent=(w.closest('section')?.querySelector('h2')?.textContent||'Data table');t.prepend(c)}t?.querySelectorAll('tr:first-child th').forEach(th=>th.scope='col')})}
function headings(){let h1=document.querySelector('h1');if(!h1){const first=document.querySelector('main h2');if(first){h1=document.createElement('h1');h1.className='sr-only';h1.textContent=document.title;first.before(h1)}}}
function dialogs(){document.querySelectorAll('dialog').forEach(d=>{const h=d.querySelector('h2,h1');if(h){if(!h.id)h.id=d.id+'-title';d.setAttribute('aria-labelledby',h.id)}d.setAttribute('aria-modal','true')})}
function invalid(){document.querySelectorAll('[aria-invalid=true]').forEach(x=>{const e=x.nextElementSibling;if(e?.classList.contains('field-error')){if(!e.id)e.id=x.id+'-error';x.setAttribute('aria-describedby',e.id)}})}
document.addEventListener('invalid',e=>{announce('Please review the highlighted field.','कृपया चिन्हित फील्ड जाँचें।',true);setTimeout(invalid,0)},true);
document.addEventListener('submit',e=>{setTimeout(()=>{const x=e.target.querySelector('[aria-invalid=true]');if(x){x.focus();invalid()}},0)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.links.open').forEach(x=>x.classList.remove('open'));document.querySelectorAll('.drawer:not([hidden])').forEach(x=>x.hidden=true)}});
applyPrefs();labelControls();tables();headings();dialogs();document.documentElement.dataset.step10='complete';})();
